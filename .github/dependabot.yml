# Dependabot: avisa de dependencias vulnerables o viejas y abre el PR que las
# actualiza. Cada PR manda un correo, por eso las menores y de parche van juntas
# en un solo PR por semana; las mayores (Spring Boot incluido) van cada una por
# su lado porque son las que rompen.
#
# Las actualizaciones de seguridad (las que dispara una alerta) no dependen de
# este archivo: se encienden en Settings → Code security.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Santiago
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      menores-y-parches:
        update-types: [minor, patch]
    ignore:
      # Spring Boot 4 no es una subida de versión sino una migración: movió los
      # módulos de test (`AutoConfigureMockMvc` ya no está donde estaba y
      # `SeguridadWebTest` no compila, comprobado el 2026-10-20 con el PR de
      # Dependabot). Se hace a propósito, con AppManageEvents como referencia.
      # Los parches y menores de 3.5.x siguen llegando.
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]

  # Las imágenes base del Dockerfile (JDK y JRE) son lo que realmente corre en
  # producción: un parche de seguridad del JRE llega por aquí, no por el pom.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Santiago
    commit-message:
      prefix: "deps"
    ignore:
      # La versión de Java la fija `java.version` del pom (17): subir el JDK o el
      # JRE de la imagen sin subirla allí desalinea compilación y ejecución. Se
      # cambia a mano, junto con el pom.
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
      - dependency-name: maven
        update-types: ["version-update:semver-major"]

