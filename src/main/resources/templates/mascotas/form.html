<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Mascota')}"></head>
<body>
<header th:replace="~{fragmentos :: barra}"></header>

<main class="contenedor">
  <h1 th:text="${mascota.id} == null ? 'Registrar mascota' : 'Editar mascota'">Mascota</h1>

  <form class="panel" th:action="@{/mascotas}" th:object="${mascota}" method="post">
    <input type="hidden" th:field="*{id}">

    <div class="rejilla">
      <div class="campo">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" th:field="*{nombre}" required autofocus>
        <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
      </div>
      <div class="campo">
        <label for="tipo">Tipo</label>
        <select id="tipo" th:field="*{tipo}" required>
          <option value="">Elige…</option>
          <option value="Perro">Perro</option>
          <option value="Gato">Gato</option>
          <option value="Ave">Ave</option>
          <option value="Roedor">Roedor</option>
          <option value="Reptil">Reptil</option>
          <option value="Pez">Pez</option>
          <option value="Otro">Otro</option>
        </select>
        <span class="error" th:if="${#fields.hasErrors('tipo')}" th:errors="*{tipo}"></span>
      </div>
      <div class="campo">
        <label for="raza">Raza</label>
        <input type="text" id="raza" th:field="*{raza}">
      </div>
      <div class="campo">
        <label for="edad">Edad (años)</label>
        <input type="number" id="edad" th:field="*{edad}" min="0" max="40" required>
        <span class="error" th:if="${#fields.hasErrors('edad')}" th:errors="*{edad}"></span>
      </div>
      <div class="campo">
        <label for="sexo">Sexo</label>
        <select id="sexo" th:field="*{sexo}">
          <option value="">—</option>
          <option value="Macho">Macho</option>
          <option value="Hembra">Hembra</option>
        </select>
      </div>
    </div>

    <div class="campo">
      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" th:field="*{descripcion}" maxlength="300"
                placeholder="Carácter, cuidados, señas particulares…"></textarea>
    </div>

    <button class="btn" type="submit">Guardar</button>
    <a class="btn fantasma" th:href="@{/mascotas}">Cancelar</a>
  </form>
</main>

<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
