<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza('Entrar')}"></head>
<body>
<header th:replace="~{fragmentos :: barra}"></header>

<main class="contenedor estrecho">
  <h1>Entrar</h1>

  <div class="aviso malo" th:if="${param.error}">
    Usuario o contraseña incorrectos.
  </div>
  <div class="aviso ok" th:if="${param.logout}">
    Sesión cerrada.
  </div>
  <div class="aviso ok" th:if="${mensaje}" th:text="${mensaje}"></div>

  <form class="panel" th:action="@{/login}" method="post">
    <div class="campo">
      <label for="username">Usuario</label>
      <input type="text" id="username" name="username" required autofocus autocomplete="username">
    </div>
    <div class="campo">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required autocomplete="current-password">
    </div>
    <button class="btn" type="submit">Entrar</button>
  </form>

  <p class="tenue">¿No tienes cuenta? <a th:href="@{/registro}">Crear una</a></p>
</main>

<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
