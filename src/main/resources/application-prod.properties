# ---------- Produccion: Postgres gestionado (Neon) ----------
# La URL, el usuario y la contrasena llegan por variables de entorno; Spring
# Boot las mapea solo (SPRING_DATASOURCE_URL -> spring.datasource.url).
# NUNCA se escriben credenciales en este archivo: el repo es publico.
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon cierra conexiones ociosas: un pool chico y con vida corta evita
# entregar una conexion ya muerta.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.connection-timeout=30000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.thymeleaf.cache=true
spring.h2.console.enabled=false

# Sin valor por defecto A PROPOSITO: si falta APP_ADMIN_PASSWORD la app no
# arranca. Es preferible un deploy fallido a un admin/admin123 en internet.
app.admin.password=${APP_ADMIN_PASSWORD}
app.datos-demo=true

# El error 500 no debe filtrar trazas al visitante
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Render termina el TLS en su proxy y habla HTTP con el contenedor: sin esto,
# Tomcat cree que la peticion es http, no marca la cookie de sesion como Secure
# y Spring Security no envia HSTS. native = RemoteIpValve, que solo acepta
# X-Forwarded-* de IPs internas (las del proxy), no de cualquier cliente.
server.forward-headers-strategy=native
# Secure a mano ademas de lo anterior: si el proxy llegara desde una IP que la
# valvula no reconoce, la cookie seguiria sin viajar nunca por http plano.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
