spring.application.name=AppManagePets

# Render (y cualquier PaaS) inyecta el puerto por la variable PORT. Si no
# existe, 8080 para desarrollo local.
server.port=${PORT:8080}

# ---------- Perfil por defecto: desarrollo local con H2 en memoria ----------
# No hace falta instalar nada para levantar la app. El perfil prod (Postgres)
# esta en application-prod.properties.
spring.datasource.url=jdbc:h2:mem:appmanagepets;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# update en vez de create: el esquema lo genera Hibernate desde las entidades y
# sobrevive al reinicio cuando la base es Postgres. Sin schema.sql que mantener
# en paralelo con dos dialectos distintos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# open-in-view=false obliga a resolver las relaciones en las consultas (JOIN
# FETCH) en vez de en la plantilla. Si algun dia salta
# LazyInitializationException, el arreglo va en el repositorio, no aqui.
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Contrasena del admin en local. En produccion es obligatoria por variable de
# entorno (ver application-prod.properties).
app.admin.password=admin123
app.datos-demo=true
